name: Private Profile feedback privacy

on:
  push:
    branches: [2.x]
  pull_request:
    branches: [2.x]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    name: Trader Feedback privacy (${{ matrix.php }}, prefix '${{ matrix.prefix }}')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.5']
        prefix: ['', pp_]
    env:
      DB_DRIVER: sqlite
      DB_DATABASE: private_profile_feedback
      DB_PREFIX: ${{ matrix.prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: curl, dom, gd, json, mbstring, openssl, pdo_sqlite, sqlite3, tokenizer, zip
          tools: composer:v2
      - name: Install the supported integration
        run: composer require --dev 'huseyinfiliz/traderfeedback:^3.2' --with-all-dependencies --no-interaction --no-progress
      - name: Exercise both extensions against an isolated database
        run: php tests/integration.php --isolated --with-trader-feedback
