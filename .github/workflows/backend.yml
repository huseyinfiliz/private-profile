name: Private Profile PHP

on:
  push:
    branches: [2.x]
  pull_request:
    branches: [2.x]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    uses: flarum/framework/.github/workflows/REUSABLE_backend.yml@2.x
    with:
      enable_backend_testing: true
      enable_phpstan: false
      backend_directory: .
      php_versions: '["8.3", "8.4", "8.5"]'
      php_extensions: 'curl, dom, gd, json, mbstring, openssl, pdo_mysql, pdo_pgsql, pdo_sqlite, sqlite3, tokenizer, zip'
      db_versions: '["mysql:8.4", "mariadb:11.8", "postgres:17", "sqlite:3"]'
      max_parallel: 4
